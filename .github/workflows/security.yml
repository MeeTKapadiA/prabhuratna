name: Security & Smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root deps
        run: npm ci || npm install

      - name: Install backend deps
        run: npm ci --prefix backend || npm install --prefix backend

      - name: npm audit (root)
        run: npm audit --audit-level=high || true

      - name: npm audit (backend)
        run: npm audit --prefix backend --audit-level=high || true

      - name: Security smoke tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_smoke_jwt_secret_key_32chars_minimum
        run: npm run security:smoke

  # Optional: set SONAR_TOKEN + SONAR_HOST_URL repo secrets to enable
  sonar:
    runs-on: ubuntu-latest
    needs: audit-and-smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
